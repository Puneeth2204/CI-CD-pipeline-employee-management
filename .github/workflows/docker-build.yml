name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend
        run: docker build -f backend/Dockerfile -t employee-backend .

      - name: Build Frontend
        run: docker build -f frontend/Dockerfile -t employee-frontend .

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/employee-management
            git pull origin main
            docker compose down
            docker compose up -d --build
